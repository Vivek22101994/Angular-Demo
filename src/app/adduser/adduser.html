<app-header></app-header>

<div class="add-user-wrapper">
  <div class="add-user-card">
    <div class="text-center mb-3">
      <img src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/logo_gmail_lockup_default_2x_r7.png" alt="Logo" height="55" />
    </div>
    <h3 class="text-center fw-bold mb-1">Add User</h3>
    <p class="text-center text-muted mb-4">Create a new account for the panel</p>

    <div class="alert" [ngClass]="error()?.toLowerCase().includes('success') ? 'alert-success' : 'alert-danger'" *ngIf="error()">
      {{ error() }}
    </div>

    <form (ngSubmit)="handleSubmit()" #loginForm="ngForm">
      <div class="row g-3">

        <div class="col-md-6">
          <ng-container *ngTemplateOutlet="lblTemplate; context: { text: 'Full Name' }"></ng-container>
          <input class="form-control" type="text" name="fullName" [(ngModel)]="fullName" [disabled]="loading()" placeholder="John Doe" />
        </div>

        <div class="col-md-6">
          <ng-container *ngTemplateOutlet="lblTemplate; context: { text: 'Email' }"></ng-container>
          <input class="form-control" type="email" name="email" [(ngModel)]="email" [disabled]="loading()" placeholder="john@example.com" />
        </div>

        <div class="col-md-6">
          <ng-container *ngTemplateOutlet="lblTemplate; context: { text: 'Mobile No' }"></ng-container>
          <input class="form-control" type="tel" name="phone" [(ngModel)]="phone" [disabled]="loading()" placeholder="+91 98765 43210" />
        </div>

        <div class="col-md-6">
          <ng-container *ngTemplateOutlet="lblTemplate; context: { text: 'Select Role' }"></ng-container>
          <select class="form-select" name="role" [(ngModel)]="role" [disabled]="loading()">
            <option value="" disabled selected>Select role</option>
            <option value="admin">Admin</option>
            <option value="manager">Manager</option>
            <option value="staff">Staff</option>
          </select>
        </div>

        <!-- Password -->
        <div class="col-md-6">
          <ng-container *ngTemplateOutlet="lblTemplate; context: { text: 'Password' }"></ng-container>

          <div class="password-wrapper">
            <input
              class="form-control"
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              autocomplete="new-password"
              [(ngModel)]="password"
              [disabled]="loading()"
              placeholder="••••••••" />

            <button
              type="button"
              class="toggle-eye"
              (click)="showPassword = !showPassword"
              [disabled]="loading()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="col-md-6">
          <ng-container *ngTemplateOutlet="lblTemplate; context: { text: 'Confirm Password' }"></ng-container>

          <div class="password-wrapper">
            <input
              class="form-control"
              [type]="showConfirmPassword ? 'text' : 'password'"
              name="confirmPassword"
              autocomplete="new-password"
              [(ngModel)]="confirmPassword"
              [disabled]="loading()"
              placeholder="••••••••" />

            <button
              type="button"
              class="toggle-eye"
              (click)="showConfirmPassword = !showConfirmPassword"
              [disabled]="loading()"
              [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
              <i class="fa" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
        </div>

      </div>

      <button type="submit" class="btn btn-primary w-100 mt-4 py-2" [disabled]="loading()">
        {{ loading() ? 'Creating User...' : 'Create User' }}
      </button>
    </form>
  </div>
</div>

<ng-template #lblTemplate let-labelText="text">
  <label class="form-label">{{ labelText }}</label>
</ng-template>

<app-footer></app-footer>
